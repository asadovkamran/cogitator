<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="device-width initial-scale=1.0" />
    <title>COGITATOR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <img id="emblem" src="assets/emblem.png" alt="mechanicus-emblem">

    <div id="screen">
        <div class="bar" id="bar-top">
            <span id="st-link">LINK :: ESTABLISHED</span>
            <span id="st-model">SPIRIT :: DORMANT</span>
            <span id="st-phase">PHASE :: IGNITION</span>
            <span id="st-corruption">CORRUPTION :: 3%</span>
        </div>

        <div id="output"><span id="caret" class="caret"></span></div>

        <div class="bar" id="bar-bottom">
            <span id="st-mode">MODE :: BOOT</span>
            <span id="st-signal">SIGNAL :: 97%</span>
            <span id="st-uptime">UPTIME :: 00:00:00</span>
        </div>
    </div>

    <div class="overlay"></div>
    <div class="flicker"></div>

    <script src="js/content.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
