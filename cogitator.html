<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COGITATOR</title>

  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%,
          #0a2818 0%,
          #04100a 45%,
          #010402 100%);
    }

    body {
      font-family: 'VT323', monospace;
      font-size: 22px;
      color: #7dff9b;
    }

    #screen {
      position: relative;
      height: 100vh;
      padding: 16px 24px;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #output {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      white-space: pre-wrap;
      text-shadow: 0 0 8px rgba(125, 255, 155, 0.22);
      scrollbar-width: none;
    }

    .bar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 4px 2px;
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(125, 255, 255, 0.55);
      white-space: nowrap;

    }

    #bar-top {
      border-bottom: 1px solid rgba(125, 255, 255, 0.18);
      margin-bottom: 10px;
    }

    #bar-bottom {
      border-top: 1px solid rgba(125, 255, 255, 0.18);
      margin-top: 10px;
    }

    #st-corruption.hot {
      color: #ff4b3a;
      text-shadow: 0 0 10px rgba(255, 60, 40, 0.35);
    }

    #output::-webkit-scrollbar {
      display: none;
    }

    .line {
      margin: 0 0 6px 0;
      min-height: 1.2em;
    }

    .boot {
      color: rgba(125, 255, 155, 0.55);
    }

    .prayer {
      color: #a9f7bb;
      text-shadow: 0 0 12px rgba(184, 255, 204, 0.25);
    }

    .hex {
      color: rgba(125, 255, 155, 0.38);
      letter-spacing: 0.06em;
    }

    .warn {
      color: #ff4b3a;
      text-shadow: 0 0 10px rgba(255, 60, 40, 0.25);
    }

    .caret {
      display: inline-block;
      width: 0.6ch;
      height: 1.05em;
      background: currentColor;
      animation: blink 1s steps(2, start) infinite;
      vertical-align: -0.12em;
    }

    .boot,
    .prayer,
    .hex,
    .warn,
    .bar span {
      animation: bloom 3s ease-in-out infinite alternate;
    }

    .caret.typing {
      animation: none;
      opacity: 1;
    }

    .overlay {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 1px,
          rgba(0, 0, 0, 0.45) 2px,
          rgba(0, 0, 0, 0.45) 3px);
      opacity: 0.28;
      mix-blend-mode: multiply;
    }

    .flicker {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: rgba(125, 255, 155, 0.05);
      animation: flicker 1.8s infinite;
    }

    #emblem {
      position: fixed;
      inset: 0;
      margin: auto;
      width: 320px;
      height: 320px;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(125, 255, 155, 0.5)) saturate(0.9);
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
      z-index: 5;
    }

    #emblem.on {
      opacity: 1;
      animation: flicker 1.2s infinite;

    }

    @keyframes blink {

      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    @keyframes flicker {
      0% {
        opacity: 0.04;
      }

      7% {
        opacity: 0.12;
      }

      10% {
        opacity: 0.05;
      }

      18% {
        opacity: 0.14;
      }

      25% {
        opacity: 0.04;
      }

      33% {
        opacity: 0.10;
      }

      41% {
        opacity: 0.16;
      }

      48% {
        opacity: 0.05;
      }

      57% {
        opacity: 0.12;
      }

      64% {
        opacity: 0.03;
      }

      71% {
        opacity: 0.15;
      }

      79% {
        opacity: 0.06;
      }

      88% {
        opacity: 0.13;
      }

      100% {
        opacity: 0.04;
      }
    }

    @keyframes bloom {
      from {
        text-shadow: 0px 0px 20px currentColor;
      }

      to {
        text-shadow: 0px 0px 35px currentColor;
      }
    }
  </style>
</head>

<body>
  <img id="emblem" src="emblem.png" alt="">
  <div id="screen">
    <div class="bar" id="bar-top">
      <span id="st-link">LINK :: ESTABLISHED</span>
      <span id="st-model">SPIRIT :: DORMANT</span>
      <span id="st-phase">PHASE :: IGNITION</span>
      <span id="st-corruption">CORRUPTION :: 3%</span>
    </div>

    <div id="output"><span id="caret" class="caret"></span></div>

    <div class="bar" id="bar-bottom">
      <span id="st-mode">MODE :: BOOT</span>
      <span id="st-signal">SIGNAL :: 97%</span>
      <span id="st-uptime">UPTIME :: 00:00:00</span>
    </div>
  </div>

  <div class="overlay"></div>
  <div class="flicker"></div>

  <script>
    const bootLines = [
      'SANCTIFIED PROTOCOL :: {CODE} ACCEPTED',
      'COGITATOR LINK :: STABLE',
      'MEMORY SHRINE :: MOUNTED',
      'AUXILIARY RITES :: ENABLED',
      'BOOT SEQUENCE {CODE} :: COMPLETE',
      'SPIRIT TRACE :: {ADDR}',
      'FIRMWARE RELIC :: RECOGNIZED',
      'IGNITION CIRCUIT :: ANOINTED'
    ];

    const prayerLines = [
      'May the Machine-God bless this silicon shell.',
      'The flesh is weak, but the circuit endures.',
      'Incense for the core, oil for the sacred drive.',
      'Let no corruption pass the firewall of faith.',
      'The spirit stirs within the ancient stack.',
      'By the sacred boot rite, be made whole.',
      'Praise the latency of the divine engine.',
      'From rust and static, deliver us.'
    ];

    const warnLines = [
      'WARNING :: flesh-corruption detected in buffer {ADDR}',
      'ALERT :: unsanctioned daemon signature {CODE}',
      'ERROR :: prayer checksum failed at {ADDR}',
      'INTRUSION :: membrane integrity failing',
      'CORRUPTION :: logic-cancer in sector {CODE}',
      'FAULT :: sacred timing drift detected'
    ];

    const responseLines = [
      'TRANSMISSION :: the machine answers in static',
      'RESPONSE :: signal from the deep archive',
      'ORACLE :: probability of sanctity 73.3%',
      'VOICE :: [unintelligible binary cant]',
      'REPLY :: the stack remembers your name',
      'ANSWER :: ask again after the next rite'
    ];

    const output = document.getElementById('output');
    const caret = document.getElementById('caret');

    let audioCtx = null;
    let masterGain = null;
    let clickBuffer = null;

    function initAudio() {
      if (audioCtx) return;

      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

      audioCtx = new AC();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.4;
      masterGain.connect(audioCtx.destination);

      const seconds = 0.03;
      const len = Math.floor(audioCtx.sampleRate * seconds);
      clickBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = clickBuffer.getChannelData(0);

      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      }
    }

    function unlockAudio() {
      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => { });
      }
    }

    function tick(volume = 0.05, rate = 1) {
      if (!audioCtx || !clickBuffer) return;
      if (audioCtx.state !== 'running') return;

      const src = audioCtx.createBufferSource();
      src.buffer = clickBuffer;
      src.playbackRate.value = rate * (0.85 + Math.random() * 0.3);

      const g = audioCtx.createGain();
      g.gain.value = volume;

      src.connect(g);
      g.connect(masterGain);
      src.start();
    }

    window.addEventListener('pointerdown', unlockAudio, { once: true });
    window.addEventListener('keydown', unlockAudio, { once: true });

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    async function typeLine(text, cls = '', speed = 28) {
      const line = document.createElement('div');
      line.className = 'line ' + cls;
      output.insertBefore(line, caret);

      caret.classList.add('typing');

      const baseRate = cls === 'warn' ? 0.65 : 1;
      let charIndex = 0;

      for (const ch of text) {
        charIndex++;
        line.textContent += ch;
        output.scrollTop = output.scrollHeight;

        // play a tick for every character
        tick(0.04 + Math.random() * 0.02, baseRate * (0.9 + Math.random() * 0.2));

        await sleep(rand(speed - 10, speed + 18));
      }

      // small end-of-line thunk
      tick(0.05, baseRate * 0.5);

      caret.classList.remove('typing');
      output.scrollTop = output.scrollHeight;
      await sleep(rand(120, 450));
    }

    async function boot() {
      await sleep(700);

      await typeLine('COGITATOR INTERFACE :: LINK ESTABLISHED', 'boot', 24);
      await typeLine('RITE OF IGNITION :: BEGIN', 'boot', 24);
      await typeLine('sanctified firmware mount... accepted', 'boot', 18);
      await typeLine('machine spirit presence... detected', 'boot', 18);

      await typeLine('0xF3A9 0x001C 0x77D1 0x0A42', 'hex', 10);

      await typeLine('Let the sacred protocols be invoked.', 'prayer', 30);
      await typeLine('WARNING :: flesh-corruption detected in buffer 0x003C', 'warn', 26);

      await typeLine('0x9D21 :: checksum accepted', 'hex', 10);
      await typeLine('The Machine-God watches through the silicon veil.', 'prayer', 32);

      await sleep(700);
      await typeLine('AWAITING NEXT TRANSMISSION ...', 'boot', 24);
    }

    const MAX_LINES = 130;

    function trimOutput() {
      while (output.children.length > MAX_LINES + 1) {
        const old = output.firstElementChild;
        if (!old) break;
        output.removeChild(old);
      }
    }

    function randItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function randHex(length) {
      const chars = '0123456789ABCDEF';
      let out = '';
      for (let i = 0; i < length; i++) {
        out += chars[Math.floor(Math.random() * chars.length)];
      }
      return out;
    }

    function randAddr() {
      return '0x' + randHex(4);
    }

    function randCode() {
      return '0x' + randHex(4) + '-' + randHex(2);
    }

    function makeHexLine() {
      const count = rand(3, 6);
      const parts = [];
      for (let i = 0; i < count; i++) {
        parts.push('0x' + randHex(4));
      }
      return parts.join(' ');
    }

    function fillTokens(text) {
      return text
        .split('{ADDR}').join(randAddr())
        .split('{CODE}').join(randCode());
    }

    function nextEndlessLine() {
      const roll = Math.random();

      if (roll < 0.32) {
        return {
          text: fillTokens(randItem(bootLines)),
          cls: 'boot',
          speed: rand(18, 26)
        };
      }

      if (roll < 0.58) {
        return {
          text: makeHexLine(),
          cls: 'hex',
          speed: rand(8, 14)
        };
      }

      if (roll < 0.78) {
        return {
          text: fillTokens(randItem(prayerLines)),
          cls: 'prayer',
          speed: rand(26, 36)
        };
      }

      if (roll < 0.88) {
        return {
          text: fillTokens(randItem(warnLines)),
          cls: 'warn',
          speed: rand(24, 32)
        };
      }

      return {
        text: fillTokens(randItem(responseLines)),
        cls: 'prayer',
        speed: rand(24, 34)
      };
    }

    async function endlessMode() {
      while (true) {
        trimOutput();

        const item = nextEndlessLine();
        await typeLine(item.text, item.cls, item.speed);

        if (Math.random() < 0.12) {
          await sleep(rand(700, 1600));
        }
      }
    }

    async function showEmblem() {
      const emblem = document.getElementById('emblem');

      emblem.classList.add('on');
      await sleep(1100);

      emblem.classList.remove('on');
      await sleep(500);
    }

    let corruption = 3;
    let phase = 'IGNITION'
    let mode = 'BOOT'
    let uptimeSec = 0;

    const PHASES = ['IGNITION', 'LITANY', 'DIAGNOSTIC', 'CORRUPTION'];

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function fmtTime(s) {
      return String(s).padStart(8, '0');
    }

    function updateStatus() {
      uptimeSec++;

      corruption += rand(-2, 3);
      if (Math.random() < 0.06) corruption += rand(5, 15);
      corruption = clamp(corruption, 1, 60);

      const signal = clamp(100 - corruption - rand(0, 6), 20, 100);

      if (Math.random() < 0.04) {
        phase = PHASES[Math.floor(Math.random() * PHASES.length)];
      }

      function setText(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      }

      setText('st-phase', 'PHASE :: ' + phase);
      setText('st-mode', 'MODE :: ' + mode);
      setText('st-uptime', 'UPTIME :: ' + fmtTime(uptimeSec) + ' CYCLES');
      setText('st-signal', 'SIGNAL :: ' + signal + '%');

      const corEl = document.getElementById('st-corruption');
      if (corEl) {
        corEl.textContent = 'CORRUPTION :: ' + corruption + '%';
        corEl.classList.toggle('hot', corruption > 30);
      }
    }

    setInterval(updateStatus, 1000);

    async function startConsole() {
      await showEmblem();
      await boot();
      mode = 'ENDLESS';
      await endlessMode();
    }

    unlockAudio();
    startConsole();
  </script>
</body>

</html>
